version: '3.8'

services:
  mssql-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mssql-mcp-server
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - MSSQL_CONNECTION_STRING=Server=178.18.252.174,1433;Database=optimax;User Id=ergys;Password=36533653;TrustServerCertificate=true;Encrypt=true;
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8585
      - MCP_TRANSPORT=sse
    expose:
      - "8585"
    networks:
      - navitrak-backend
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - traefik.enable=false

networks:
  navitrak-backend:
    external: true
